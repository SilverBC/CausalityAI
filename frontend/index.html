<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Check whether data supports a causal claim, or explore what causes what." />
  <title>Bluff-or-Buff</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/logo-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/logo-180.png" />
  <script>
    /* Apply a stored light/dark choice before the first paint (no flash). Without one, CSS follows the device. */
    try {
      var t = localStorage.getItem("causal-audit:theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* storage blocked: follow the device */ }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
