# Run the whole app on your own machine:
#   docker compose up --build          then open http://localhost:8000
# Optional: the language-model features (executive summary, chat, literature investigations, claim-only searches)
# need a Gemini API key (free tier works):   GEMINI_API_KEY=... docker compose up --build
# Without one, every analysis still runs; summaries use a template.
services:
  app:
    build: .
    image: causal-audit
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_WEB_MODEL: ${GEMINI_WEB_MODEL:-gemini-2.5-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Your own machine: the demo rate limits are for a shared server, so they are off here.
      # Set to "on" when this container serves other people (see README, "Demo limits").
      CAUSAL_LIMITS: ${CAUSAL_LIMITS:-off}
    volumes:
      - causal-data:/data            # analyses, accounts and chats survive restarts
    restart: unless-stopped

volumes:
  causal-data:
